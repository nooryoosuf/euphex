name: Ingest full hero roster

# One-click full-roster ingest: Actions → "Ingest full hero roster" → Run workflow.
# Adds every upstream hero + skin splash (remote URLs) to
# src/data/mlbb/heroes.json without touching local downloads.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ingest roster
        run: node scripts/fetch-all-heroes.mjs
      - name: Commit registry
        run: |
          git config user.name "euphex-bot"
          git config user.email "euphex-bot@users.noreply.github.com"
          git add src/data/mlbb/heroes.json
          git diff --cached --quiet || git commit -m "chore: full hero roster ingest"
          git push
