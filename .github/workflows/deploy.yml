name: Build check (Cloudflare Pages deploys)

# GitHub Pages deployment is disabled — production is Cloudflare Pages → euphex.mv.
# Cloudflare builds this repo directly (framework: Next.js static export).
# This workflow only verifies the static export builds with an EMPTY basePath
# (root-domain hosting). Do not re-add NEXT_PUBLIC_BASE_PATH=/euphex unless
# you switch back to <user>.github.io/euphex/ project-site hosting.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static export (root domain — no basePath)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
